<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Survey Results Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .table-container {
            max-height: 70vh;
            overflow-x: auto;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid #e5e7eb;
        }
        .data-table th {
            background-color: #eef2ff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        /* 첫 번째 열 (ID) 고정 */
        .data-table td:first-child {
            font-weight: 600;
            background-color: #fcfdff;
            position: sticky;
            left: 0;
            z-index: 5;
        }
        .data-table th:first-child {
            position: sticky;
            left: 0;
            z-index: 15;
            background-color: #dbeafe;
        }
        .update-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            transition: background-color 0.5s;
        }
        .updated {
            background-color: #10b981; /* Green */
        }
        .pending {
            background-color: #f97316; /* Orange */
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-full mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">📑 통합 설문 응답 상세 데이터</h1>
            <p class="text-lg text-blue-600">Node.js Express 서버 연동 실시간 자동 업데이트</p>
            
            <div class="mt-4 flex justify-center items-center text-gray-600 font-semibold text-sm">
                <span id="update-status" class="update-indicator pending"></span>
                <span id="last-updated-time">최초 로딩 중...</span>
            </div>
        </header>

        <div id="table-output" class="table-container shadow-xl">
            <p class="p-6 text-center text-xl text-gray-600">데이터를 서버에서 불러오는 중...</p>
        </div>

    </div>

    <script>
        // --- 전역 변수 ---
        let surveyResults = []; 

        // --- 유틸리티 함수 ---

        /**
         * 밀리초(ms)를 'MM분 SS.ss초' 형식으로 변환합니다.
         */
        const formatDuration = (ms) => {
            if (typeof ms !== 'number' || ms < 0) return '-';
            const totalSeconds = ms / 1000;
            const minutes = Math.floor(totalSeconds / 60);
            const remainingSeconds = totalSeconds % 60;
            
            return `${minutes}분 ${remainingSeconds.toFixed(2)}초`;
        };

        /**
         * 값이 'true', true, 'on', '1' 등 긍정적인지를 확인합니다. (동의 체크박스 로직 강화)
         */
        const isConsentAgreed = (value) => {
            if (typeof value === 'boolean') return value;
            if (typeof value === 'string') {
                const lowerValue = value.toLowerCase();
                return lowerValue === 'true' || lowerValue === 'on' || lowerValue === '1';
            }
            if (typeof value === 'number') return value === 1;
            return false;
        };

        const updateStatusIndicator = (isUpdated) => {
            const indicator = document.getElementById('update-status');
            const timeSpan = document.getElementById('last-updated-time');
            
            if (isUpdated) {
                indicator.classList.remove('pending');
                indicator.classList.add('updated');
                timeSpan.textContent = `마지막 업데이트: ${new Date().toLocaleTimeString('ko-KR')}`;
            } else {
                indicator.classList.remove('updated');
                indicator.classList.add('pending');
                timeSpan.textContent = `업데이트 대기 중...`;
            }
        };


        // --- 테이블 렌더링 함수 ---

        const renderDataTable = () => {
            const container = document.getElementById('table-output');
            container.innerHTML = ''; 
            
            if (surveyResults.length === 0) {
                container.innerHTML = '<p class="p-6 text-center text-xl text-gray-600">응답 데이터가 없습니다.</p>';
                return;
            }

            const table = document.createElement('table');
            table.className = 'w-full data-table border-collapse';

            // 헤더 정의 (Section 2의 위치를 Section 1 바로 뒤로 이동)
            const headers = [
                { label: 'ID', key: 'id', class: 'w-10 bg-blue-200' },
                { label: '동의여부', key: 'consentAgreed', section: '기본', class: 'bg-green-100' },
                { label: '학년', key: 'gradeLevel', section: '기본' },
                
                // Section 1: Short-form Video/Content Consumption (Q1)
                { label: 'Q1a: 소셜 시간', key: 'q1_a', section: 'S1' },
                { label: 'Q1b: 숏폼 시간', key: 'q1_b', section: 'S1' },
                { label: 'Q1c: 플랫폼', key: 'q1_c', section: 'S1' }, // 배열 처리 필요
                { label: 'Q1d: 숏폼 개수', key: 'q1_d', section: 'S1' },
                { label: 'Q1e: 머문 시간', key: 'q1_e', section: 'S1' },
                { label: 'Q1f: 무의식 횟수', key: 'q1_f', section: 'S1' },
                
                // Section 2: Attention Span (Q2) - PASSAGE 전으로 이동 완료
                { label: 'Q2a: 15분 집중', key: 'q2_a', section: 'S2' },
                { label: 'Q2b: 전환 빈도', key: 'q2_b', section: 'S2' },
                { label: 'Q2c: 산만해짐', key: 'q2_c', section: 'S2' },

                // Reading Time
                { label: '⏰ 독서 시간 (ms)', key: 'finalReadingDuration', section: 'TIME', class: 'bg-yellow-100 font-bold' },
                
                // Quiz (Q3)
                { label: 'Q3-1', key: 'quiz_q1', section: 'Quiz' },
                { label: 'Q3-2', key: 'quiz_q2', section: 'Quiz' },
                { label: 'Q3-3', key: 'quiz_q3', section: 'Quiz' },
                { label: 'Q3-4', key: 'quiz_q4', section: 'Quiz' },
                { label: 'Q3-5', key: 'quiz_q5', section: 'Quiz' },
                { label: 'Q3-6', key: 'quiz_q6', section: 'Quiz' },
                { label: 'Q3-7', key: 'quiz_q7', section: 'Quiz' },
            ];
            
            const thead = table.createTHead();
            const headerRow = thead.insertRow();
            headers.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h.label;
                th.className = h.class || 'text-sm font-semibold text-gray-700';
                if (h.section === 'S1') th.style.backgroundColor = '#e0f2fe'; // Blue Light
                if (h.section === 'S2') th.style.backgroundColor = '#f3e8ff'; // Purple Light
                if (h.section === 'Quiz') th.style.backgroundColor = '#fef3c7'; // Yellow Light (Quiz)
                headerRow.appendChild(th);
            });

            // 바디 생성
            const tbody = table.createTBody();
            surveyResults.forEach((result) => {
                const row = tbody.insertRow();
                row.className = 'hover:bg-gray-50';

                headers.forEach(h => {
                    const cell = row.insertCell();
                    const value = result[h.key];
                    const agreed = isConsentAgreed(value); // 동의 여부 체크

                    if (h.key === 'id') {
                        cell.textContent = value;
                    } else if (h.key === 'consentAgreed') { 
                        // **동의 여부 로직 수정 및 강화**
                        cell.textContent = agreed ? 'O' : 'X';
                        cell.className = agreed ? 'font-semibold bg-green-50' : 'font-semibold bg-red-50';
                    } else if (h.key === 'q1_c') {
                        // q1_c는 배열로 서버에서 전송되므로 문자열로 변환
                        cell.textContent = Array.isArray(value) ? value.join(', ') : (value || '-');
                    } else if (h.key === 'finalReadingDuration') { 
                        // DB에서 저장된 finalReadingDuration 값을 사용
                        cell.textContent = formatDuration(value); 
                        cell.className = 'font-bold bg-yellow-50';
                    } else {
                        // 기타 모든 질문에 대한 응답 (Q1, Q2, Q3 등)
                        cell.textContent = value || '-';
                    }
                });
            });

            container.appendChild(table);
            updateStatusIndicator(true); 
        };

        // --- 서버 통신 및 자동 업데이트 (JavaScript) ---

        const fetchResults = async () => {
            updateStatusIndicator(false); // 로딩 중 표시

            try {
                // Node.js Express 서버에 정의된 API 엔드포인트에 접속 (server.js의 PORT: 3000)
                const response = await fetch('http://localhost:3000/api/results'); // URL 수정
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const newResults = await response.json();
                
                // 데이터 업데이트 및 테이블 다시 그리기
                surveyResults = newResults;
                renderDataTable();
            } catch (error) {
                console.error("데이터를 불러오는 중 오류 발생:", error);
                // 오류 메시지를 Node.js Express 서버에 맞게 수정
                document.getElementById('table-output').innerHTML = 
                    '<p class="p-6 text-center text-xl text-red-600">🔴 서버 연결 오류: Node.js Express 서버(server.js)가 포트 **3000**에서 실행 중인지 확인하세요.</p>';
            }
        };

        // 애플리케이션 초기화
        document.addEventListener('DOMContentLoaded', () => {
            fetchResults();
            
            // 15초마다 데이터 자동 업데이트
            setInterval(fetchResults, 15000); 
        });
    </script>
</body>
</html>
